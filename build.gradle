plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.0.6'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'jacoco'
}

group = 'org.makechtec.web'
version = '4.0.1'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

repositories {
    mavenCentral()
    mavenLocal()

    maven {
        url =
                uri("https://makech-technology-879381274336.d.codeartifact.us-east-2.amazonaws.com/maven/makech-technology-maven-repository/")
        credentials {
            username = "aws"
            password = System.getenv("CODEARTIFACT_AUTH_TOKEN")
        }
    }
}

dependencies {

    implementation("org.springframework.boot:spring-boot-starter-web")
    providedRuntime("org.springframework.boot:spring-boot-starter-tomcat")
    testImplementation("org.springframework.boot:spring-boot-starter-test") {
        exclude([
                "group" : "com.vaadin.external.google",
                "module": "android-json"
        ])
    }
    implementation("com.google.guava:guava:33.4.8-jre")
    implementation("org.json:json:20231013")
    implementation("org.makechtec.software:json_tree:3.0.0")
    implementation("org.bouncycastle:bcprov-jdk18on:1.78.1")
    implementation("de.mkammerer:argon2-jvm:2.11")
    implementation("org.makechtec.software:sql_support:3.0.6-BETA")
    testImplementation("org.makechtec.software:sql_support_testing:1.0.0-BETA")
    implementation("org.makechtec.bearer_authentication:tools:1.4.3")
    testImplementation("org.concordion:concordion:4.0.1")
}

tasks.named('test') {
    finalizedBy(tasks.jacocoTestReport)
    exclude '**/sql_tests/**/*.class'
    useJUnitPlatform()
}

tasks.jacocoTestReport {
    dependsOn(tasks.test)
}

tasks.register('sqlTests') {
    include("**/sql_tests/**/*.class")
    useJunitPlatform()
}

tasks.register('integrationTests') {
    include("**/integration/**/*.class")
    useJunitPlatform()
}